<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>輸入事件一致性教材</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f1f5f9;
        color: #102a43;
        font-family: system-ui, sans-serif;
      }
      main {
        width: min(100% - 2rem, 48rem);
        margin: auto;
        padding: 1rem 0;
      }
      section {
        margin-block: 1rem;
        padding: 1rem;
        border: 1px solid #9fb3c8;
        border-radius: 0.6rem;
        background: #fff;
      }
      label,
      input,
      button {
        font: inherit;
      }
      input {
        display: block;
        width: 100%;
        margin: 0.45rem 0 0.8rem;
        padding: 0.65rem;
        border: 1px solid #486581;
        border-radius: 0.3rem;
      }
      button {
        min-height: 2.5rem;
        margin: 0.2rem;
        padding: 0.4rem 0.75rem;
        border: 1px solid #334e68;
        border-radius: 0.3rem;
        background: #fff;
        color: #102a43;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 0.22rem solid #005fcc;
        outline-offset: 0.14rem;
      }
      #complete {
        background: #0b6e4f;
        border-color: #07513b;
        color: #fff;
      }
      #status {
        font-weight: 700;
      }
      #log {
        max-height: 13rem;
        overflow: auto;
        padding-left: 1.3rem;
      }
      .note {
        color: #486581;
      }
      #snapshot,
      #result,
      #log {
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>單一 form submit 的輸入一致性</h1>
      <p class="note">
        固定離線教材：文字草稿可包含非數字，允許空字串、最多 120 個 JavaScript
        字元單位；沒有網路、PLC、後端 CAS 或真實 IME 驗證。
      </p>
      <section aria-labelledby="editor-title">
        <h2 id="editor-title">草稿與操作</h2>
        <form id="command-form">
          <label for="draft">文字草稿</label>
          <input id="draft" value="初稿 A" autocomplete="off" maxlength="120" />
          <button id="submit" type="submit">原生送出</button>
        </form>
        <button id="complete" type="button">模擬回覆</button>
        <button id="cancel-draft" type="button">取消未送出草稿</button>
        <button id="test-compose-start" type="button">
          測試：開始合成組字
        </button>
        <button id="test-compose-end" type="button">測試：結束合成組字</button>
        <button id="test-pointerup" type="button">
          測試：只派發 pointerup
        </button>
        <button id="reset" type="button">重設教材</button>
        <p id="status" role="status">Editing；requestCount=0。</p>
        <p id="snapshot">snapshot=—</p>
        <p id="result">result=—</p>
      </section>
      <section aria-labelledby="log-title">
        <h2 id="log-title">有界 rolling diagnostic log</h2>
        <p id="counts">ops=0/16；log=0/16（僅保留最近診斷）。</p>
        <ol id="log"></ol>
      </section>
    </main>
    <script>
      (() => {
        const form = document.getElementById('command-form');
        const draft = document.getElementById('draft');
        const submit = document.getElementById('submit');
        const complete = document.getElementById('complete');
        const cancelDraft = document.getElementById('cancel-draft');
        const testComposeStart = document.getElementById('test-compose-start');
        const testComposeEnd = document.getElementById('test-compose-end');
        const testPointerUp = document.getElementById('test-pointerup');
        const reset = document.getElementById('reset');
        const status = document.getElementById('status');
        const snapshot = document.getElementById('snapshot');
        const result = document.getElementById('result');
        const counts = document.getElementById('counts');
        const log = document.getElementById('log');
        const initialDraft = '初稿 A';
        const maximumDraftLength = 120;
        const state = {
          composing: false,
          pending: null,
          nextId: 1,
          operations: [],
          logs: [],
        };

        function addLog(message) {
          state.logs.push(message);
          if (state.logs.length > 16) state.logs.shift();
        }
        function render() {
          const requestCount = state.operations.length;
          status.textContent = `${state.pending ? 'Pending' : 'Editing'}；requestCount=${requestCount}。`;
          snapshot.textContent = state.pending
            ? `snapshot=${state.pending.id}:${state.pending.payload}`
            : 'snapshot=—';
          counts.textContent = `ops=${requestCount}/16；log=${state.logs.length}/16（僅保留最近診斷）。`;
          log.replaceChildren(
            ...state.logs.map((entry) => {
              const item = document.createElement('li');
              item.textContent = entry;
              return item;
            }),
          );
        }
        function acceptSubmit() {
          if (state.composing) {
            addLog('COMPOSING_SUBMIT_IGNORED');
            render();
            return;
          }
          if (state.pending !== null) {
            addLog('DUPLICATE_PENDING');
            render();
            return;
          }
          if (draft.value.length > maximumDraftLength) {
            addLog('DRAFT_LENGTH_REJECTED');
            result.textContent = 'result=草稿超過 120 個字元單位。';
            render();
            return;
          }
          if (state.operations.length >= 16) {
            addLog('OP_LIMIT_REJECTED');
            result.textContent =
              'result=已達 16 筆上限，本次未送出；可重設教材再演練。';
            render();
            return;
          }
          const operation = Object.freeze({
            id: `OP-${String(state.nextId).padStart(2, '0')}`,
            payload: draft.value,
          });
          state.nextId += 1;
          state.pending = operation;
          state.operations.push(operation);
          addLog(`SUBMIT ${operation.id} snapshot=${operation.payload}`);
          result.textContent = 'result=Pending；使用「模擬回覆」完成。';
          render();
        }
        form.addEventListener('submit', (event) => {
          event.preventDefault();
          acceptSubmit();
        });
        draft.addEventListener('compositionstart', () => {
          state.composing = true;
          addLog('COMPOSITION_START');
          render();
        });
        draft.addEventListener('compositionend', () => {
          state.composing = false;
          addLog('COMPOSITION_END');
          render();
        });
        draft.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter') return;
          if (state.composing || event.isComposing) {
            event.preventDefault();
            addLog('ENTER_COMPOSING_IGNORED');
            render();
          } else if (event.repeat) {
            event.preventDefault();
            addLog('ENTER_REPEAT_IGNORED');
            render();
          }
        });
        draft.addEventListener('focusout', () => {
          addLog('FOCUSOUT_DRAFT_RETAINED');
          render();
        });
        submit.addEventListener('pointerup', () => {
          addLog('POINTERUP_NO_SUBMIT');
          render();
        });
        testComposeStart.addEventListener('click', () => {
          draft.focus();
          draft.dispatchEvent(
            new CompositionEvent('compositionstart', { bubbles: true }),
          );
        });
        testComposeEnd.addEventListener('click', () => {
          draft.focus();
          draft.dispatchEvent(
            new CompositionEvent('compositionend', { bubbles: true }),
          );
        });
        testPointerUp.addEventListener('click', () => {
          submit.dispatchEvent(
            new PointerEvent('pointerup', { bubbles: true }),
          );
        });
        complete.addEventListener('click', () => {
          if (state.pending === null) {
            addLog('NO_PENDING_REPLY');
            render();
            return;
          }
          const done = state.pending;
          state.pending = null;
          addLog(`COMPLETED ${done.id}`);
          result.textContent = `result=Completed ${done.id} snapshot=${done.payload}；draft 未被回覆覆寫。`;
          render();
        });
        cancelDraft.addEventListener('click', () => {
          if (state.pending !== null) {
            addLog('CANCEL_SENT_OPERATION_REJECTED');
            result.textContent = 'result=已送出的 Pending 操作不能由本頁撤回。';
            render();
            return;
          }
          draft.value = '';
          addLog('UNSUBMITTED_DRAFT_CLEARED');
          result.textContent = 'result=只清除未送出的本機草稿。';
          render();
        });
        reset.addEventListener('click', () => {
          state.composing = false;
          state.pending = null;
          state.nextId = 1;
          state.operations = [];
          state.logs = [];
          draft.value = initialDraft;
          result.textContent = 'result=—';
          render();
        });
        render();
        window.inputEventsDemo = { state: () => structuredClone(state) };
      })();
    </script>
  </body>
</html>
